<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOVI FlowCam</title>
    <link rel="stylesheet" href="./css/styles.css"/>
    <script src="https://kit.fontawesome.com/a86f4eb0a3.js" crossorigin="anonymous"></script>
  </head>
  <body class="text-white bg-black">
    <header class="bg-[#120052] py-4 px-4 w-auto flex items-center justify-center">       
        <div class="flex justify-center">
            <img src="./images/logo_jovi.png" alt="Logo da JOVI" class="w-25">
        </div>
    </header>

    <main>
        <div id="camera" class="w-screen z-10 p-12 items-center flex flex-col justify-center">
            <div class="flex justify-center w-full h-full" id="video-preview-container">
                <img id="image-preview" src="./images/photo-ex1.jpg" class="w-full h-full object-cover">
            </div>
            <div id="dica-container" class="hidden justify-center items-center wrap relative z-10 bottom-32 w-2/3 px-4 py-2 bg-[#2A2A36] opacity-80 rounded-2xl">
                <i class="fa-regular fa-lightbulb text-4xl px-2" style="color: rgb(255, 212, 59);"></i>
                <p id="dica-paragrafo" class="text-white font-medium text-center">
                    <!-- Que tal dar um passo para o lado direito? -->
                </p>
            </div>

            <div id="photo-click-container" class="relative top-8 z-10 flex justify-around items-center w-4/5 md:w-full">
                <label for="selecao-galeria" class="inline-flex items-center justify-center rounded-lg cursor-pointer transition-colors duration-300 shadow-md hover:shadow-lg gap-2">
                    <i class="fa-solid fa-images text-white text-2xl"></i>
                </label>

                <input type="file" class="hidden" id="selecao-galeria" accept="image/*" multiple>
    

                <button id="btn-camera" type="button" class="flex items-center justify-center w-18 h-18 bg-white hover:bg-gray-400 text-white rounded-full shadow-lg transition-transform active:scale-95 focus:outline-none"></button>
                
                <i class="fa-solid fa-camera-rotate text-white text-3xl"></i>
            </div>
        </div>                
        <div id="opcoes-camera-container" class="relative top-5 z-10 p-4 flex justify-around w-full mb-12">
            <button id="btn-photo" class="text-white font-medium px-4 py-1 bg-[#120052] rounded-full ativo">Foto</button>
            <button id="btn-video" class="text-white font-medium px-4 py-1">Video</button>
            <button id="btn-document" class="text-white font-medium px-4 py-1">Documento</button>
        </div> 

        <div id="social-container" class="text-center p-4 hidden">
            <p>Para onde vamos enviar?</p>
            <div class="flex flex-wrap justify-center items-center gap-2.5 p-8 w-fit">
                <button id="card-tiktok" class="px-8 py-4 w-full bg-[#2A2A36] rounded-3xl focus:outline-2 focus:outline-offset-2 focus:outline-white sm:flex sm:flex-wrap sm:items-center sm:gap-2.5 sm:justify-center sm:w-fit">
                    <i class="fa-brands fa-tiktok text-4xl p-6 rounded-full bg-black" style="color: rgb(255, 255, 255);"></i>
                    <div>
                        <p class="text-nowrap font-medium">Otimizar para TikTok</p>
                    </div>
                </button>

                <button id="card-instagram" class="px-8 py-4 w-full bg-[#2A2A36] rounded-3xl focus:outline-2 focus:outline-offset-2 focus:outline-white sm:flex sm:flex-wrap sm:items-center sm:gap-2.5 sm:justify-center sm:w-fit">
                    <i class="fa-brands fa-instagram text-4xl p-6 rounded-full bg-black" style="color: rgb(255, 255, 255);"></i>
                    <div>
                        <p class="text-nowrap font-medium">Otimizar para Instagram</p>
                    </div>
                </button>

                <button id="card-doc" class="hidden px-8 py-4 w-full bg-[#2A2A36] rounded-3xl focus:outline-2 focus:outline-offset-2 focus:outline-white sm:hidden sm:flex-wrap sm:items-center sm:gap-2.5 sm:justify-center sm:w-fit sm:place-self-center">
                    <i class="fa-solid fa-file-pdf text-4xl p-6 rounded-full bg-black" style="color: rgb(255, 255, 255);"></i>
                    <div>
                        <p class="text-nowrap font-medium">Otimizar para Documento</p>
                    </div>
                </button>

                <button id="card-gallery" class="px-8 py-4 w-full bg-[#2A2A36] rounded-3xl focus:outline-2 focus:outline-offset-2 focus:outline-white sm:flex sm:flex-wrap sm:items-center sm:gap-2.5 sm:justify-center sm:w-fit">
                    <i class="fa-solid fa-images text-4xl p-6 rounded-full bg-black" style="color: rgb(255, 255, 255);"></i>
                    <div>
                        <p class="text-nowrap font-medium">Salvar na galeria</p>
                    </div>
                </button>
            </div>
            <div class="mb-8 flex gap-12 justify-center">
                <button id="btn-cancelar-photo" class="font-extralight px-8 py-4 border border-gray-400 rounded-4xl">
                    Refazer
                </button>
                <button id="btn-enviar" class="px-8 py-4 bg-[#120052] rounded-4xl font-bold">
                    Exportar e concluir
                </button>
            </div>
        </div>
    </main>
    
    <script src="./js/script.js"></script>
    
  </body>
</html>
