<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOVI FlowCam</title>
    <link rel="stylesheet" href="./css/styles.css"/>
    <script src="https://kit.fontawesome.com/a86f4eb0a3.js" crossorigin="anonymous"></script>
  </head>
  <body class="text-white bg-black">
    <header class="bg-[#120052] py-4 px-4 w-auto flex items-center justify-center">       
        <div class="flex justify-center">
            <img src="./images/logo_jovi.png" alt="Logo da JOVI" class="w-20">
        </div>
    </header>

    <main>
        <div id="dialog-camera" class="absolute w-screen bg-zinc-950 z-10 p-12">
            <div class="flex justify-center w-full h-full" id="video-preview-container">
                <img id="image-preview" src="./images/photo-ex1.jpg">
                <div class="absolute -bottom-26 z-10 flex justify-around items-center w-4/5 landscape:flex-col-reverse landscape:right-3 landscape:w-fit landscape:top-0 landscape:bottom-0">
                    <i class="fa-solid fa-images text-white text-2xl"></i>

                    <button id="btn-camera" type="button" class="flex items-center justify-center w-18 h-18 bg-white hover:bg-gray-400 text-white rounded-full shadow-lg transition-transform active:scale-95 focus:outline-none"></button>
                    
                    <i class="fa-solid fa-camera-rotate text-white text-3xl"></i>
                </div>
            </div>

            <div id="photo-preview-container" class="w-full h-full items-center justify-center hidden">

                <div class="w-full h-full flex items-center justify-center text-white">
                    <img class="w-full h-auto" crossorigin="anonymous" src="/dist/images/arara.jpg" alt="Foto previsualizada" id="photo-preview">
                </div>

                <div id="actions-preview" class="absolute -bottom-20 z-10 flex p-2 justify-around items-center w-full landsacpe:flex-col-reverse landscape:right-3 landscape:w-fit landscape:top-0 landscape:bottom-0">
                    <button class="text-white font-medium px-3 py-2">Repetir</button>
                    <button class="text-white font-medium px-3 py-2">OK</button>
                </div>               
            </div>
        </div>                
        <div class="absolute z-10 bottom-5 flex p-2 justify-around items-center w-full">
            <button id="btn-photo" class="text-white  font-medium px-4 py-1 bg-[#120052] rounded-full">Foto</button>
            <button id="btn-video" class="text-white  font-medium">Video</button>
            <button id="btn-document" class="text-white  font-medium">Documento</button>
        </div> 
    </main>
    
    <script src="./js/script.js"></script>
    
  </body>
</html>
